name: worship-support-develop

services:
  workspace:
    container_name: worship-support-develop-workspace
    build:
      context: ..
      dockerfile: .docker/Dockerfile.develop.workspace
    volumes:
      # bind
      - ..:/app
      - ~/.claude.json:/root/.claude.json
      # volume
      - claude-config:/root/.claude
      - vscode-server:/root/.vscode-server
    command: sleep infinity
    env_file:
      - ../.env/.env.develop

  api:
    container_name: worship-support-develop-api
    build:
      context: ..
      dockerfile: .docker/Dockerfile.develop.api
    command: python -m worship_support.api.bin.server
    volumes:
      - ..:/app:ro
    ports:
      - "127.0.0.1:${DEVELOP_API_PORT}:${DEVELOP_API_CONTAINER_PORT}"
    depends_on:
      - database
      - database-test
    env_file:
      - ../.env/.env.develop

  worker:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.develop.api
    command: python -m worship_support.api.bin.worker
    volumes:
      - ..:/app:ro
    depends_on:
      - database
    env_file:
      - ../.env/.env.develop
    deploy:
      replicas: ${DEVELOP_WORKER_REPLICAS}

  uwi:
    container_name: worship-support-develop-uwi
    build:
      context: ..
      dockerfile: .docker/Dockerfile.develop.uwi
    volumes:
      # bind
      - ..:/app
      # volume
      - uwi_node_modules:/app/worship_support/uwi/node_modules
      - uwi_next:/app/worship_support/uwi/.next
    environment:
      - API_URL=http://api:${DEVELOP_API_CONTAINER_PORT}
    ports:
      - "${DEVELOP_UWI_PORT}:${DEVELOP_UWI_CONTAINER_PORT}"
    depends_on:
      - api
    env_file:
      - ../.env/.env.develop

  database:
    container_name: worship-support-develop-database
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DEVELOP_POSTGRES_USER}
      - POSTGRES_PASSWORD=${DEVELOP_POSTGRES_PASSWORD}
      - POSTGRES_DB=${DEVELOP_POSTGRES_DB}
    ports:
      - "127.0.0.1:${DEVELOP_POSTGRES_PORT}:${DEVELOP_POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  database-test:
    container_name: worship-support-develop-database-test
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${TEST_POSTGRES_USER}
      - POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TEST_POSTGRES_DB}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT}:${TEST_POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  postgres_test_data:
  uwi_node_modules:
  uwi_next:
  claude-config:
  vscode-server:
