<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">요청마다 확인하는 인증과 업무 인가 경계</title><desc id="desc">인증과 CSRF 필터는 요청을 방어한다. Actor에는 신원과 세션 정보만 있다. Application이 현재 공간 상태와 Membership 및 필요한 문서 권한을 검사한다. Workspace ADMIN은 RESTRICTED 문서 우회 권한이 아니다.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker></defs>
  <style>text{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.box{fill:white;stroke:#cbd5e1;stroke-width:1.5}</style>
  <rect width="1100" height="700" rx="16" fill="#f8fafc"/><text x="32" y="45" class="title">인증은 “누구인가” · 인가는 “이 작업을 해도 되는가”</text><text x="32" y="75" class="note">검사 책임을 표현한 도식 · 실제 Security 필터 순서를 시간순으로 표시한 것은 아님</text>
  <rect x="32" y="112" width="1034" height="143" rx="12" fill="#dbeafe"/>
  <text x="54" y="146" class="head">Spring Security · HTTP 요청 방어</text>
  <text x="54" y="180" class="body">세션의 로그인 정보 복원 · 계정 ACTIVE / 세션 버전 유효성 검사</text>
  <text x="54" y="210" class="body">변경 요청은 CSRF 검사 · 일부 요청은 앞선 필터 단계에서 즉시 거부</text>
  <text x="54" y="239" class="note">쿠키: Secure / HttpOnly / SameSite=Lax · 클라이언트가 보낸 role/userId를 인증으로 신뢰하지 않음</text>
  <path d="M549 255 V282" class="line"/>
  <rect x="32" y="284" width="1034" height="75" rx="12" class="box"/>
  <text x="54" y="317" class="head">Actor · 서버가 인증에서 얻은 사용자 정보</text><text x="54" y="343" class="body">userId · sessionVersion · reauthenticatedAt   —   WorkspaceRole / DocumentGrant 없음</text>
  <path d="M275 359 V386" class="line"/>
  <rect x="32" y="388" width="490" height="155" rx="12" fill="#dcfce7"/>
  <text x="54" y="422" class="head">Workspace 경계</text><text x="54" y="456" class="body">현재 공간 ACTIVE?</text><text x="54" y="486" class="body">현재 사용자의 ACTIVE Membership?</text><text x="54" y="516" class="body">공간 관리 작업이면 ADMIN 확인</text>
  <rect x="576" y="388" width="490" height="155" rx="12" fill="#ede9fe"/>
  <text x="598" y="422" class="head">Document 경계 · 문서 작업일 때</text><text x="598" y="456" class="body">workspaceId + documentId로 범위 조회</text><text x="598" y="486" class="body">현재 Membership의 Grant / OPEN 확인</text><text x="598" y="516" class="body">READ / EDIT / MANAGE 충족?</text>
  <path d="M522 466 H574" class="line"/>
  <rect x="32" y="575" width="1034" height="86" rx="12" fill="#fff7ed"/>
  <text x="54" y="608" class="head">두 역할은 독립 · ADMIN이라고 문서 MANAGER는 아님</text>
  <text x="54" y="638" class="body">RESTRICTED + Grant 없음 → ADMIN도 읽기 거부 · 권한 검사와 DB 변경은 같은 transaction</text>
</svg>
