<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
  <title id="title">User, Workspace, Membership, Document와 Grant의 실제 테이블 관계</title><desc id="desc">화살표는 자식 FK에서 참조 대상 방향이다. Membership은 User와 Workspace를 연결한다. DocumentGrant는 같은 Workspace의 Membership과 Document를 함께 참조한다. Setlist 본문은 Document와 일대일로 연결된다. 각 박스에는 핵심 필드만 표시한다.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker></defs>
  <style>text{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#0f172a}.title{font-size:25px;font-weight:700}.name{font:700 20px ui-monospace,monospace;fill:white}.field{font:17px ui-monospace,monospace}.body{font-size:17px}.note{font-size:15px;fill:#475569}.box{fill:white;stroke:#cbd5e1;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="1100" height="740" rx="16" fill="#f8fafc"/><text x="32" y="45" class="title">사용자와 권한 · 공간 역할과 문서 역할을 분리</text><text x="32" y="74" class="note">핵심 6개 테이블 / 핵심 필드만 표시 · 화살표: FK → 참조 대상 · 전체 컬럼과 나머지 관계는 아래 사전</text>
  <path d="M488 281 H195 V221" class="line"/><text x="238" y="270" class="note">user_id → id</text>
  <path d="M648 281 H723 V170 H778" class="line"/><text x="555" y="240" class="note">workspace_id → id</text>
  <path d="M935 281 V222" class="line"/>
  <path d="M563 495 V423" class="line"/>
  <path d="M715 551 H748 V351 H778" class="line"/>
  <path d="M935 495 V423" class="line"/>
  <rect x="40" y="115" width="310" height="106" rx="10" class="box"/><rect x="40" y="115" width="310" height="36" rx="10" fill="#2563eb"/>
  <text x="57" y="140" class="name">user_account</text><text x="57" y="180" class="field">PK id · state</text><text x="57" y="205" class="field">display_name</text>
  <rect x="780" y="115" width="280" height="106" rx="10" class="box"/><rect x="780" y="115" width="280" height="36" rx="10" fill="#0f766e"/>
  <text x="797" y="140" class="name">workspace</text><text x="797" y="180" class="field">PK id · name · state</text><text x="797" y="205" class="field">terminated_at</text>
  <rect x="405" y="282" width="310" height="139" rx="10" class="box"/><rect x="405" y="282" width="310" height="36" rx="10" fill="#0f766e"/>
  <text x="422" y="307" class="name">workspace_membership</text><text x="422" y="345" class="field">PK id · FK user_id</text><text x="422" y="372" class="field">FK workspace_id · state</text><text x="422" y="399" class="field">role: ADMIN / MEMBER</text>
  <rect x="780" y="282" width="280" height="139" rx="10" class="box"/><rect x="780" y="282" width="280" height="36" rx="10" fill="#7c3aed"/>
  <text x="797" y="307" class="name">document</text><text x="797" y="345" class="field">PK id · FK workspace_id</text><text x="797" y="372" class="field">access_policy · version</text><text x="797" y="399" class="body">OPEN / RESTRICTED</text>
  <rect x="405" y="497" width="310" height="139" rx="10" class="box"/><rect x="405" y="497" width="310" height="36" rx="10" fill="#7c3aed"/>
  <text x="422" y="522" class="name">document_grant</text><text x="422" y="560" class="field">PK id · workspace_id</text><text x="422" y="587" class="field">document_id · membership_id</text><text x="422" y="614" class="field">role: MANAGER/EDITOR/VIEWER</text>
  <rect x="780" y="497" width="280" height="139" rx="10" class="box"/><rect x="780" y="497" width="280" height="36" rx="10" fill="#7c3aed"/>
  <text x="797" y="522" class="name">setlist</text><text x="797" y="560" class="field">PK id · workspace_id</text><text x="797" y="587" class="field">FK document_id · notes</text><text x="797" y="614" class="body">Document 1 : Setlist 1</text>
  <rect x="40" y="330" width="310" height="215" rx="12" fill="#eff6ff"/>
  <text x="59" y="366" class="body" font-weight="700">User 1 : Membership N</text><text x="59" y="399" class="body">한 계정은 여러 공간에 참여</text>
  <text x="59" y="443" class="body" font-weight="700">Workspace 1 : Membership N</text><text x="59" y="476" class="body">활성 소속 중 ADMIN은 1명</text><text x="59" y="511" class="note">재가입: 새 Membership / Grant 미복원</text>
  <text x="40" y="680" class="body">Grant의 두 복합 FK: (workspace_id, membership_id) / (workspace_id, document_id)</text>
  <text x="40" y="713" class="note">둘 다 같은 공간이어야 함 · ADMIN은 RESTRICTED 접근 우회 불가 · 공간 Role은 문서 Role을 자동 부여하지 않음</text>
</svg>
