<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">두 사용자의 저장 경쟁과 명시적 수동 재저장</title><desc id="desc">두 사용자 모두 버전1에서 시작한다. A의 저장이 버전2로 확정된 후 B의 버전1 저장은 409로 거부되고 DB는 바뀌지 않는다. B의 화면 초안은 프론트에서 보존하고 권한 있는 최신본 비교 후 새 요청을 한다.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker></defs>
  <style>text{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.life{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:5 5}</style>
  <rect width="1100" height="620" rx="16" fill="#f8fafc"/><text x="32" y="45" class="title">동시 수정 · 늦은 저장은 이전 내용을 덮어쓰지 않음</text><text x="32" y="74" class="note">Backend의 거부 계약은 검증됨 · 화면 초안 유지/비교 UI는 프론트 구현 책임</text>
  <rect x="40" y="105" width="280" height="75" rx="12" fill="#dbeafe"/><text x="60" y="138" class="head">A의 브라우저</text><text x="60" y="165" class="body">version 1 열기</text>
  <rect x="410" y="105" width="280" height="75" rx="12" fill="#dcfce7"/><text x="430" y="138" class="head">Backend + DB</text><text x="430" y="165" class="body">현재 권한 · 버전 검사</text>
  <rect x="780" y="105" width="280" height="75" rx="12" fill="#ede9fe"/><text x="800" y="138" class="head">B의 브라우저</text><text x="800" y="165" class="body">version 1 열기 · 수정 중</text>
  <path d="M180 180 V494 M550 180 V494 M920 180 V494" class="life"/>
  <path d="M180 236 H548" class="line"/><text x="196" y="222" class="body">저장 · expectedVersion=1</text>
  <path d="M550 293 H182" class="line"/><text x="196" y="279" class="body">성공 · version 2로 commit</text>
  <path d="M920 350 H552" class="line"/><text x="599" y="335" class="body">늦은 저장 · expectedVersion=1</text>
  <path d="M550 408 H918" class="line"/><text x="574" y="393" class="body">409 VERSION_CONFLICT · DB 무변경</text>
  <rect x="40" y="460" width="1020" height="116" rx="12" fill="white" stroke="#cbd5e1"/>
  <text x="60" y="494" class="head">B는 초안 유지 → 권한이 있으면 최신본 조회 → 직접 비교 → 명시적 새 저장 요청</text>
  <text x="60" y="526" class="body">expectedVersion만 최신으로 바꿔 기존 초안을 자동 재전송하지 않습니다.</text>
  <text x="60" y="555" class="note">그사이 권한 회수: 403 · 공간 종료: 404 · 인증 무효화: 401 — 충돌 409와 구분하며 최신본도 권한 없이 제공하지 않음</text>
</svg>
