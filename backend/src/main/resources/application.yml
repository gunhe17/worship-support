spring:
  application:
    name: worship-core
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/worship?connectionTimeZone=UTC}
    username: ${DB_USERNAME:worship}
    password: ${DB_PASSWORD:}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
