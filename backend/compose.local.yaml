# Disposable local development only. No provider/production credentials or volume.
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_DATABASE: worship
      MYSQL_USER: worship
      MYSQL_PASSWORD: local-only-worship
      MYSQL_ROOT_PASSWORD: local-only-root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-only-root"]
      interval: 3s
      timeout: 3s
      retries: 30
