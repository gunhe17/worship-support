function renderList() {
  const q = $("#q").value.trim().toLowerCase(), t = $("#team").value, f = $("#filter").value;
  const rows = S.map((s, i) => [s, i]).filter(([s]) => (t === "" || s.t === +t) && (!q || s.title.toLowerCase().includes(q) || D.teams[s.t].toLowerCase().includes(q))
    && (f === "" || (f === "one" ? s.st : s.sec.length > 1)));
  $("#count").textContent = `${rows.length}곡`;
  $("#list").innerHTML = rows.map(([s, i]) => `<button class="item" role="option" data-i="${i}" aria-current="${i === cur}"><span class="ttl">${esc(s.title)}</span><span class="sub">${esc(D.teams[s.t])}</span><span class="badge">${answer(s)}<br>${s.sec.length > 1 ? s.sec.length + "구간" : ""}</span></button>`).join("");
  $("#list").querySelectorAll(".item").forEach(b => b.onclick = () => select(+b.dataset.i));
}

function select(i) {
  cur = i;
  try { history.replaceState(null, "", "#" + S[i].id); } catch (e) {}
  $("#list").querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", +b.dataset.i === i));
  const s = S[i], d = $("#detail");
  const sub = s.st ? `반·두 배 후보 ${s.alt[0]} / ${s.alt[1]}` : `템포가 ±4% 넘게 변함 · 곡 중앙값 ${s.bpm}`;
  d.innerHTML = `
    <div class="panel" style="display:flex;flex-direction:column;gap:10px">
      <div class="eyebrow">${esc(D.teams[s.t])} · ${mmss(s.dur)}</div>
      <h2>${esc(s.title)}</h2>
      <div class="answer"><span class="big">${answer(s)} <span style="font-size:16px;color:var(--ink-3)">BPM</span></span>
        <span class="pill${s.st ? "" : " warn"}">${s.st ? "BPM 하나로 응답" : "범위로 응답"}</span>
        <span class="pill">${s.sec.length}구간</span></div>
      <div class="note">${sub} · <a href="https://www.youtube.com/watch?v=${s.id}" target="_blank" rel="noopener">YouTube에서 듣기</a></div>
    </div>
    <div class="panel"><div class="legend"><span><i class="sw" style="background:var(--s1)"></i>8 beat 창 템포</span><span><i class="sw" style="background:var(--s2)"></i>구간별 템포</span></div><div class="scroll"><svg id="curve" viewBox="0 0 720 300" width="100%" role="img" aria-label="템포 곡선"></svg></div></div>
    <div class="panel scroll"><table><tr><th>구간</th><th>시작</th><th>끝</th><th>길이</th><th>BPM</th><th style="text-align:left">앞 구간 대비</th></tr>
      ${s.sec.map((q, k) => { const r = k ? q[2] / s.sec[k - 1][2] : null; return `<tr><td>${k + 1}</td><td>${mmss(q[0])}</td><td>${mmss(q[1])}</td><td>${mmss(q[1] - q[0])}</td><td><b>${q[2]}</b></td><td style="text-align:left">${r ? `×${r.toFixed(2)} <span style="color:var(--s2)">${ratioTag(r)}</span>` : "—"}</td></tr>`; }).join("")}</table></div>`;
  drawCurve(s);
}

function drawCurve(s) {
  const svg = $("#curve"), W = 720, H = 300, m = { l: 42, r: 12, t: 14, b: 28 };
  const tmax = Math.max(s.dur, s.sec[s.sec.length - 1][1], s.ct[s.ct.length - 1] || 1);
  const vals = s.cb.concat(s.sec.map(q => q[2])), vlo = Math.floor((Math.min(...vals) - 8) / 10) * 10, vhi = Math.ceil((Math.max(...vals) + 8) / 10) * 10;
  const sx = t => m.l + t / tmax * (W - m.l - m.r), sy = v => H - m.b - (v - vlo) / (vhi - vlo) * (H - m.t - m.b);
  const step = (vhi - vlo) > 80 ? 20 : 10;
  for (let v = vlo; v <= vhi; v += step) { el("line", { x1: m.l, x2: W - m.r, y1: sy(v), y2: sy(v), stroke: "var(--grid)" }, svg); el("text", { x: m.l - 6, y: sy(v) + 4, "text-anchor": "end" }, svg).textContent = v; }
  for (let t = 0; t <= tmax; t += 30) { el("line", { x1: sx(t), x2: sx(t), y1: H - m.b, y2: H - m.b + 4, stroke: "var(--ink-3)" }, svg); if (t % 60 === 0) el("text", { x: sx(t), y: H - 8, "text-anchor": "middle" }, svg).textContent = mmss(t); }
  s.sec.forEach((q, k) => {
    if (k) el("line", { x1: sx(q[0]), x2: sx(q[0]), y1: m.t, y2: H - m.b, stroke: "var(--rule)", "stroke-width": 1 }, svg);
    el("line", { x1: sx(q[0]), x2: sx(q[1]), y1: sy(q[2]), y2: sy(q[2]), stroke: "var(--s2)", "stroke-width": 2.5, "stroke-dasharray": "6 3" }, svg);
    if (sx(q[1]) - sx(q[0]) > 28) el("text", { x: sx(q[0]) + 4, y: sy(q[2]) - 6, class: "lbl" }, svg).textContent = q[2];
  });
  el("path", { d: s.ct.map((t, i) => `${i ? "L" : "M"}${sx(t).toFixed(1)},${sy(s.cb[i]).toFixed(1)}`).join(""), fill: "none", stroke: "var(--s1)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink-3)", visibility: "hidden" }, svg), dot = el("circle", { r: 4, fill: "var(--s1)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }, svg);
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    let bi = 0; s.ct.forEach((t, i) => { if (Math.abs(sx(t) - px) < Math.abs(sx(s.ct[bi]) - px)) bi = i; });
    const t = s.ct[bi], q = s.sec.findIndex(q => t >= q[0] && t < q[1]);
    cross.setAttribute("x1", sx(t)); cross.setAttribute("x2", sx(t)); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", sx(t)); dot.setAttribute("cy", sy(s.cb[bi])); dot.setAttribute("visibility", "visible");
    showTip(`${mmss(t)} · 창 ${s.cb[bi]} BPM${q >= 0 ? `<br>구간 ${q + 1}: ${s.sec[q][2]} BPM` : ""}`, e.clientX, e.clientY);
  };
  svg.onmouseleave = () => { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); hideTip(); };
}

$("#q").oninput = renderList; $("#team").onchange = renderList; $("#filter").onchange = renderList;
const h = location.hash.slice(1), hi = S.findIndex(s => s.id === h);
cur = hi >= 0 ? hi : 0;
renderList(); select(cur);
</script>

</body></html>
